name: Angebote aktualisieren

on:
  schedule:
    # GitHub-Cron läuft in UTC. Zur vollen Stunde ist GitHub überlastet und verwirft geplante Läufe teils ganz –
    # deshalb krumme Minuten und ein zweiter Lauf als Reserve (committet nur, wenn sich etwas geändert hat):
    # 03:37 UTC = 05:37 Uhr MESZ / 04:37 Uhr MEZ · 05:07 UTC = 07:07 Uhr MESZ / 06:07 Uhr MEZ
    - cron: "37 3 * * *"
    - cron: "7 5 * * *"
  # Änderungen an diesem Workflow lösen sofort einen Lauf aus – so lässt er sich ohne Klick prüfen
  push:
    branches: [main]
    paths: [".github/workflows/update-deals.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Nur diese Quellen (kommagetrennt: marktguru,kaufda,prospektangebote) – leer = alle"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    name: Scrapen & committen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r scripts/requirements.txt

      - name: Playwright-Browser aus dem Cache holen
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Chromium für Playwright installieren
        # Schlägt das fehl, läuft der Scraper trotzdem – prospektangebote wird dann übersprungen.
        continue-on-error: true
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Scraper ausführen
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ -n "${ONLY}" ]; then args+=(--only "${ONLY}"); fi
          python scripts/update_deals.py "${args[@]}"
          # Zweites Produkt mit eigenem Datenordner (data/redbull/) – ein Fehler dort bricht den Lauf nicht ab
          python scripts/update_deals.py --product redbull "${args[@]}" || echo "::warning::Lauf für Red Bull fehlgeschlagen"

      - name: Änderungen committen & pushen
        id: commit
        run: |
          git add data/deals.json data/regular-prices.json data/history.json data/city data/redbull
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Daten – nichts zu committen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Angebote aktualisiert: $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')"
          # Falls zwischenzeitlich jemand gepusht hat: rebasen statt scheitern
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Seite neu deployen
    needs: update
    if: needs.update.outputs.changed == 'true'
    # Pushes mit GITHUB_TOKEN lösen keine anderen Workflows aus (Schutz vor Endlosschleifen).
    # Deshalb wird das Pages-Deployment hier direkt als wiederverwendbarer Workflow aufgerufen.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
